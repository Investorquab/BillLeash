<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;padding:0;background:transparent}</style></head>
<body><div style="width:512px;height:512px">
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0c4433"/><stop offset="1" stop-color="#06231a"/></linearGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#dbf75f"/><stop offset="1" stop-color="#a6e039"/></linearGradient>
    <radialGradient id="glow" cx="0.44" cy="0.36" r="0.7"><stop offset="0" stop-color="#1f7d5c" stop-opacity="0.5"/><stop offset="1" stop-color="#1f7d5c" stop-opacity="0"/></radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.28"/></filter>
  </defs>
  <rect width="512" height="512" rx="118" fill="url(#bg)"/>
  <rect width="512" height="512" rx="118" fill="url(#glow)"/>
  <rect x="6" y="6" width="500" height="500" rx="112" fill="none" stroke="#dff77f" stroke-opacity="0.12" stroke-width="2"/>

  <!-- leash tether from top, curving to a clip ring that collars the coin -->
  <g filter="url(#soft)" fill="none" stroke="url(#lime)" stroke-linecap="round">
    <path d="M150 96 C 150 150, 150 150, 150 188" stroke-width="30"/>
    <!-- clip ring -->
    <circle cx="150" cy="232" r="40" stroke-width="30"/>
    <!-- short link down to the coin collar -->
    <path d="M188 258 C 214 276, 214 276, 236 294" stroke-width="20"/>
  </g>

  <!-- coin: the dollar the leash holds -->
  <g filter="url(#soft)">
    <circle cx="322" cy="312" r="126" fill="url(#lime)"/>
    <circle cx="322" cy="312" r="126" fill="none" stroke="#06231a" stroke-opacity="0.16" stroke-width="7"/>
    <circle cx="322" cy="312" r="104" fill="none" stroke="#06231a" stroke-opacity="0.16" stroke-width="4" stroke-dasharray="3 10"/>
    <text x="322" y="356" font-family="DejaVu Sans, Arial, sans-serif" font-size="150" font-weight="800" fill="#06231a" text-anchor="middle">$</text>
  </g>
</svg></div></body></html>
